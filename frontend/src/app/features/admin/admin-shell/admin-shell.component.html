<div class="shell glass-bg-canvas">

  <!-- Mobile Topbar -->
  <header class="shell-topbar glass-card">
    <button class="shell-menu-btn" (click)="toggleSidebar()" aria-label="Toggle menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="shell-topbar-brand">
      <div class="shell-logo admin-logo">A</div>
      <span>Admin Portal</span>
    </div>
    <span class="glass-badge admin-top-badge">ADMIN</span>
  </header>

  <!-- Mobile backdrop -->
  @if (sidebarOpen()) {
    <div class="shell-backdrop" (click)="sidebarOpen.set(false)"></div>
  }

  <!-- Glass Sidebar -->
  <aside class="shell-sidebar glass-card glass-card--strong admin-sidebar" [class.shell-sidebar--open]="sidebarOpen()">

    <!-- Brand -->
    <div class="shell-brand">
      <div class="shell-logo admin-logo">A</div>
      <div class="shell-brand-text">
        <span class="shell-brand-name">ApexBank</span>
        <span class="shell-brand-sub admin-sub">Admin Portal</span>
      </div>
    </div>

    <!-- Admin User Card -->
    <div class="shell-user-card glass-panel">
      <div class="shell-user-avatar admin-avatar">
        {{ admin()?.fullName?.charAt(0) || 'A' }}
        <span class="shell-user-status"></span>
      </div>
      <div class="shell-user-details">
        <div class="shell-user-name">{{ admin()?.fullName || 'Administrator' }}</div>
        <div class="shell-user-account admin-role-badge">ADMIN</div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="shell-nav">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path"
           routerLinkActive="shell-nav-link--active"
           [routerLinkActiveOptions]="{ exact: true }"
           class="shell-nav-link"
           (click)="sidebarOpen.set(false)">
          <span class="shell-nav-icon" [innerHTML]="item.icon"></span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Footer -->
    <div class="shell-sidebar-footer">
      <button class="glass-btn glass-btn--secondary glass-btn--full shell-logout-btn" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>
