<div class="glass-page">
  <div class="glass-card glass-form-wrapper glass-animate-in">

    <div class="auth-brand-row">
      <span class="auth-brand-label">ApexBank</span>
    </div>

    <h1 class="glass-title">Set New Password</h1>
    <p class="glass-subtitle">Choose a strong new login password</p>

    @if (errorMessage()) { <div class="glass-alert glass-alert--error">{{ errorMessage() }}</div> }

    @if (successMessage()) {
    <div class="glass-alert glass-alert--success">{{ successMessage() }}</div>
    } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="glass-input-group">
        <label class="glass-label" for="snp-new">Login Password</label>
        <div class="snp-password-wrapper">
          <input id="snp-new" class="glass-input snp-password-input" [type]="showPassword() ? 'text' : 'password'"
            formControlName="newLoginPassword" placeholder="Minimum 8 characters" autocomplete="new-password" />
          <button type="button" class="snp-eye-btn" (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            }
          </button>
        </div>
      </div>

      <div class="glass-input-group">
        <label class="glass-label" for="snp-confirm">Confirm Login Password</label>
        <div class="snp-password-wrapper">
          <input id="snp-confirm" class="glass-input snp-password-input" [type]="showPassword() ? 'text' : 'password'"
            formControlName="confirmLoginPassword" placeholder="Re-enter password" autocomplete="new-password" />
        </div>
        @if (form.errors?.['mismatch'] && form.get('confirmLoginPassword')?.touched) {
        <span class="glass-error-text">Passwords do not match</span>
        }
      </div>

      <button type="submit" class="glass-btn glass-btn--primary glass-btn--full" [disabled]="loading()">
        {{ loading() ? 'Saving…' : 'Set New Password' }}
      </button>
    </form>
    }

    <hr class="glass-divider" />
    <div class="login-back-row">
      <a routerLink="/login" class="glass-link">← Back to Login</a>
    </div>
  </div>
</div>
