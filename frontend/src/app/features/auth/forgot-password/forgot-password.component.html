<div class="glass-page">
  <div class="glass-card glass-form-wrapper glass-animate-in">

    <!-- Brand mark -->
    <div class="auth-brand-row">
      <span class="auth-brand-label">ApexBank</span>
    </div>

    <h1 class="glass-title">Forgot Password</h1>
    <p class="glass-subtitle">Enter your User ID to reset your password</p>

    @if (errorMessage()) { <div class="glass-alert glass-alert--error">{{ errorMessage() }}</div> }
    @if (devOtp()) { <div class="glass-alert glass-alert--info">Demo OTP: <strong>{{ devOtp() }}</strong></div> }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="glass-input-group">
        <label class="glass-label" for="fp-userid">User ID</label>
        <input id="fp-userid" class="glass-input" type="text" formControlName="userId"
          placeholder="Enter your User ID" />
      </div>
      <div class="glass-input-group">
        <label class="glass-label" for="fp-otp">Enter OTP</label>
        <div class="forgot-otp-row">
          <input id="fp-otp" class="glass-input" type="text" formControlName="otp" placeholder="6-digit OTP" />
          <button type="button" class="glass-btn glass-btn--secondary" (click)="sendOtp()" [disabled]="otpSending()">
            {{ otpSending() ? 'Sending...' : (otpSent() ? 'Resend OTP' : 'Send OTP') }}
          </button>
        </div>
      </div>
      <button type="submit" class="glass-btn glass-btn--primary glass-btn--full" [disabled]="loading()">
        {{ loading() ? 'Verifying...' : 'Proceed' }}
      </button>
    </form>
    <hr class="glass-divider" />
    <div class="login-back-row">
      <a routerLink="/login" class="glass-link">← Back to Login</a>
    </div>
  </div>
</div>
