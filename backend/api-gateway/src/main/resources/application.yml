server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          order: 1
          predicates:
            - Path=/api/auth/**

        - id: transaction-service-admin
          uri: lb://transaction-service
          order: 2
          predicates:
            - Path=/api/admin/transactions,/api/admin/transactions/**

        - id: transaction-service
          uri: lb://transaction-service
          order: 3
          predicates:
            - Path=/api/fund-transfer/**,/api/payees/**

        - id: account-service
          uri: lb://account-service
          order: 4
          predicates:
            - Path=/api/accounts/**,/api/dashboard/**,/api/admin/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

apexbank:
  jwt:
    secret: ${JWT_SECRET:ApexBank_Super_Secret_Key_Change_In_Production_2026_Minimum_256_Bits_Long_Value}

logging:
  level:
    org.springframework.cloud.gateway: INFO
